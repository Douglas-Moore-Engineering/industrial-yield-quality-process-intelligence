name: Data validation
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'data/contracts/**', 'requirements*.txt', 'README.md', 'docs/**', 'notebooks/**', '.azure/lenze-*.json', 'governance/measurements/**', 'scripts/**', '**/SKILL.md', '.agents/**', '.codex/**', '.github/workflows/data-validation.yml']
  push:
    paths: ['src/**', 'tests/**', 'data/contracts/**', 'requirements*.txt', 'README.md', 'docs/**', 'notebooks/**', '.azure/lenze-*.json', 'governance/measurements/**', 'scripts/**', '**/SKILL.md', '.agents/**', '.codex/**', '.github/workflows/data-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt -r requirements-data.txt
      - run: python scripts/check_repository_contract.py
      - run: python -m pytest -q

      - run: python -m pip install -r requirements-notebooks.txt
      - run: python scripts/execute_notebooks.py
