name: Data validation
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'data/contracts/**', 'requirements*.txt', '.github/workflows/data-validation.yml']
  push:
    paths: ['src/**', 'tests/**', 'data/contracts/**', 'requirements*.txt', '.github/workflows/data-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt -r requirements-data.txt
      - run: python -m pytest -q
