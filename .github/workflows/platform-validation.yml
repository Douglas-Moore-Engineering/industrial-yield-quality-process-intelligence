name: Platform validation
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/platform-*.yml']
  push:
    paths: ['infra/**', '.github/workflows/platform-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bicep compiler
        run: az bicep install --version v0.47.16
      - name: Compile all entrypoints and verify ML security contract
        run: bash infra/azure/validate-templates.sh "$RUNNER_TEMP/iyqpis-templates"
      - name: Test deployment guards without Azure access
        shell: pwsh
        run: |
          ./infra/azure/Test-PlatformGuards.ps1
          ./infra/azure/Test-CiGuards.ps1
          ./infra/azure/Test-DataPublishGuards.ps1
          ./infra/azure/Test-DataJobGuards.ps1
          ./infra/azure/Test-ReferenceAIGuards.ps1
      - name: Test security regressions and operational safety
        env:
          IYQPIS_COMPILED_ML: ${{ runner.temp }}/iyqpis-templates/ml-workspace.json
        run: python -m unittest discover -s infra/azure -p 'test_*.py'
      - name: Install pinned security scanner
        run: pip install checkov==3.3.20
      - name: Security scan
        run: checkov -d infra/ --framework bicep --compact
