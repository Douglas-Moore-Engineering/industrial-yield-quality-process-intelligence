name: Platform validation
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/platform-*.yml']
  push:
    paths: ['infra/**', '.github/workflows/platform-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bicep compiler
        run: az bicep install --version v0.47.16
      - name: Compile platform
        shell: bash
        run: |
          for template in infra/main.bicep infra/operations.bicep infra/foundation-ci.bicep infra/probe.bicep infra/data-network.bicep infra/data-job.bicep; do
            az bicep build --file "$template" --outfile "$RUNNER_TEMP/$(basename "$template" .bicep).json"
          done
      - name: Test deployment guards without Azure access
        shell: pwsh
        run: |
          ./infra/azure/Test-PlatformGuards.ps1
          ./infra/azure/Test-CiGuards.ps1
          ./infra/azure/Test-DataPublishGuards.ps1
          ./infra/azure/Test-DataJobGuards.ps1
          ./infra/azure/Test-ReferenceAIGuards.ps1
      - name: Test private probe safety with simulated responses
        run: python -m unittest discover -s infra/azure -p test_private_probe.py
      - name: Install pinned security scanner
        run: pip install checkov==3.3.20
      - name: Security scan
        run: checkov -d infra/ --framework bicep --compact
